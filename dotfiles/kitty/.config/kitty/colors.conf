selection_background  #ffb68c

# Cursor
cursor                #ffb68c
cursor_text_color     #532200

# URL Farbe (passend zum Akzent)
url_color             #ffb68c

# Border (Fensterränder in Kitty)
active_border_color   #ffb68c
inactive_border_color #9f8d84
bell_border_color     #ffb4ab

# Tab bar - Passend zum Waybar Design
tab_bar_style               fade
tab_fade                    1
active_tab_foreground       #532200
active_tab_background       #ffb68c
active_tab_font_style       bold
inactive_tab_foreground     #d7c2b8
inactive_tab_background     #221a15
inactive_tab_font_style     normal
tab_bar_background          #1a120d

