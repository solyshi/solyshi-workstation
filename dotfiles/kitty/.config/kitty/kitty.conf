# ==============================================================================
# Fonts
# ==============================================================================
# BEGIN_KITTY_FONTS
font_family      family="Iosevka"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

font_size 12.0
disable_ligatures never

# Iosevka ships no Nerd Font glyphs, so route the icon ranges to
# JetBrainsMono NF explicitly instead of relying on fontconfig fallback.
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58 JetBrainsMono Nerd Font
symbol_map U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0BF JetBrainsMono Nerd Font
symbol_map U+E0C0-U+E0C8,U+E0CC-U+E0D7,U+E200-U+E2A9 JetBrainsMono Nerd Font
symbol_map U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF JetBrainsMono Nerd Font
symbol_map U+EA60-U+EC1E,U+F000-U+F2FF,U+F300-U+F381 JetBrainsMono Nerd Font
symbol_map U+F400-U+F533,U+F0001-U+F1AF0 JetBrainsMono Nerd Font

# ==============================================================================
# Window
# ==============================================================================
window_padding_width 8
placement_strategy center
background_opacity 0.70
background_blur 1
hide_window_decorations yes

# ==============================================================================
# Colors (matugen generated)
# ==============================================================================
include colors.conf

# ==============================================================================
# Cursor
# ==============================================================================
cursor_shape beam
cursor_blink_interval 0

# ==============================================================================
# Scrollback
# ==============================================================================
scrollback_lines 10000

# ==============================================================================
# Bell
# ==============================================================================
enable_audio_bell no

# ==============================================================================
# Remote Control
# ==============================================================================
allow_remote_control yes
listen_on unix:/tmp/kitty
watcher yes



