# --- tmux status line (Matugen generated) ---
#
# Sourced from tmux.conf. tmux was the only app on this machine with no matugen
# template, so the status bar stayed on tmux's stock green while everything else
# followed the wallpaper.
#
# There was no status styling at all before this file, so these are new settings
# rather than overrides -- tmux.conf deliberately contains none of them, so the
# palette lives in exactly one place.

# --- Status bar ---
set -g status-style "fg={{colors.on_surface_variant.default.hex}},bg={{colors.surface_container.default.hex}}"
set -g status-position bottom
set -g status-justify left

# Session name as a filled badge
set -g status-left "#[fg={{colors.on_primary.default.hex}},bg={{colors.primary.default.hex}},bold] #S #[default] "
set -g status-left-length 32

# Date, then time in the accent colour
set -g status-right "#[fg={{colors.outline.default.hex}}]%a %d %b #[fg={{colors.primary.default.hex}},bold]%H:%M "
set -g status-right-length 40

# --- Windows ---
set -g window-status-format "#[fg={{colors.on_surface_variant.default.hex}},bg={{colors.surface_container.default.hex}}] #I #W "
set -g window-status-current-format "#[fg={{colors.on_secondary_container.default.hex}},bg={{colors.secondary_container.default.hex}},bold] #I #W "
set -g window-status-separator ""
set -g window-status-activity-style "fg={{colors.tertiary.default.hex}},bg={{colors.surface_container.default.hex}}"
set -g window-status-bell-style "fg={{colors.on_error_container.default.hex}},bg={{colors.error_container.default.hex}}"

# --- Panes ---
# Active border picks up the accent, so the focused pane is obvious without
# needing the status line.
set -g pane-border-style "fg={{colors.outline_variant.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"

# --- Command prompt and messages ---
set -g message-style "fg={{colors.on_primary_container.default.hex}},bg={{colors.primary_container.default.hex}}"
set -g message-command-style "fg={{colors.on_primary_container.default.hex}},bg={{colors.primary_container.default.hex}}"

# --- Copy mode selection ---
set -g mode-style "fg={{colors.on_primary.default.hex}},bg={{colors.primary.default.hex}}"

# --- Popups (prefix+f runs tmux-sessionizer in one) ---
set -g popup-style "bg={{colors.surface.default.hex}}"
set -g popup-border-style "fg={{colors.primary.default.hex}}"
