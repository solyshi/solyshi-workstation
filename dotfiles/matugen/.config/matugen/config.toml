[config]
source_color_index = 0
reload_apps = true
set_wallpaper = false  
mode = "dark"

[config.reload_apps_list]
hyprland = true
kitty = true
rofi = true
mako = true

[[config.custom_keywords]]
name = "colors"

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/appearance/colors.lua"

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

[templates.mako]
input_path = "~/.config/matugen/templates/mako-colors"
output_path = "~/.config/mako/colors"

[templates.vesktop]
input_path = "~/.config/matugen/templates/vesktop-colors.css"
output_path = "~/.config/vesktop/themes/matugen.css"

[templates.qutebrowser]
input_path = "~/.config/matugen/templates/qute-colors.py"
output_path = "~/.config/qutebrowser/colors.py"

[templates.yazi]
input_path = "~/.config/matugen/templates/yazi-flavor.toml"
output_path = "~/.config/yazi/flavors/matugen.yazi/flavor.toml"

# tmux is not in matugen's built-in reload_apps_list, so the new colours are
# pushed with an explicit post_hook. `tmux source-file` fails harmlessly when
# no server is running, hence the has-session guard.
[templates.tmux]
input_path = "~/.config/matugen/templates/tmux-colors.conf"
output_path = "~/.config/tmux/colors.conf"
post_hook = "tmux has-session 2>/dev/null && tmux source-file ~/.config/tmux/tmux.conf || true"

# Writes into its own theme dir so the Marketplace theme stays untouched.
# To activate, set in config-xpui.ini:
#   current_theme = matugen
#   color_scheme  = blue-dark
# then run: spicetify apply
[templates.spicetify]
input_path = "~/.config/matugen/templates/spicetify-color.ini"
output_path = "~/.config/spicetify/Themes/matugen/color.ini"
