[mgr]
ratio = [1, 2, 4]          # Column ratio (parent, current, preview)
sort_by = "natural"        # Natural sorting (1, 2, 10 instead of 1, 10, 2)
sort_sensitive = false     # Case-insensitive sorting
sort_reverse = false
sort_dir_first = true      # Directories always on top
show_hidden = true         # Hidden files shown by default (toggle with .)
show_symlink = true        # Show symlink target
linemode = "git"

[preview]
max_width = 1000
max_height = 1000
wrap = "no"
tab_size = 2

[opener]
edit = [
    { run = 'nvim "$@"', block = true, desc = "Neovim" },
]
video = [
    { run = 'mpv "$@"', orphan = true, desc = "mpv" },
]
pdf = [
    { run = 'zathura "$@"', orphan = true, desc = "Zathura" },
]
image = [
    { run = 'imv "$@"', orphan = true, desc = "imv" },
]

[open]
rules = [
    # Text
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "*/javascript", use = "edit" },

    # Video
    { mime = "video/*", use = "video" },

    # PDF
    { mime = "application/pdf", use = "pdf" },

    # Images
    { mime = "image/*", use = "image" },
]
