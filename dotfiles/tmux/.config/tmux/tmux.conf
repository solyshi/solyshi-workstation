# ================================
# ========== General =============
# ================================

# Starts window indexing at 1
set -g base-index 1     
setw -g pane-base-index 1

# Fills gaps automatically
set -g renumber-windows on

# Activate mouse (mostly for terminal copying)
set -g mouse on

# escape-time 0, history-limit 50000, focus-events and aggressive-resize used to
# be spelled out here. tmux-sensible already sets all of them to these same
# values, and TPM runs last, so the duplicates were doing nothing.
#
# default-terminal does need to stay: sensible would otherwise downgrade it to
# screen-256color. tmux-256color is what makes truecolor work -- tmux 3.8
# auto-detects RGB from kitty's terminfo, so no terminal-overrides hack is
# needed (verify with: tmux display -p '#{client_termfeatures}').
set -g default-terminal "tmux-256color"

# Let the kitty graphics protocol through to the outer terminal. yazi's image
# previews (yazi.toml: previewers use `image`) are drawn with it, and tmux
# swallows the escape sequences without this -- previews just silently showed
# nothing inside a tmux pane.
set -g allow-passthrough on

setw -g mode-keys vi

# ================================
# ========== Keybind =============
# ================================

# "Leader" Key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Use TMUX Sessionizer script inside of tmux
unbind f
bind-key f display-popup -E -w 80% -h 60% "$HOME/.local/bin/tmux-sessionizer"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Reload tmux config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Pane splitting more intuitive
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# C-h/j/k/l pane navigation comes from vim-tmux-navigator below. There was a
# hand-rolled version here that matched `pane_current_command` against /vim/i,
# and it was dead code anyway: TPM sources last and the plugin rebinds all four
# in the root table. The plugin's version is also strictly better -- it checks
# `ps -o state= -o comm=` against ^[^TXZ ]+ +(\S+/)?g?\.?(view|l?n?vim?x?|fzf)
# (diff)?(-wrapped)?$, so it ignores stopped/zombie processes, matches -wrapped
# binaries and absolute paths, and hands the keys to fzf too.

# ================================
# ========== Theme ===============
# ================================
# Generated by matugen from the current wallpaper; see
# matugen/templates/tmux-colors.conf. -q so a fresh clone that has not run
# matugen yet still sources without an error.
source-file -q ~/.config/tmux/colors.conf

# ================================
# ========== Plugins =============
# ================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TPM (has to be the last line *before* the overrides below)
run '~/.config/tmux/plugins/tpm/tpm'

# ================================
# ======== Post-TPM ==============
# ================================
# Anything tmux-sensible sets unconditionally has to be re-set after TPM runs,
# otherwise sensible wins. status-keys was set to vi up in the General section
# and silently lost: sensible.tmux:117 does a bare `set-option -g status-keys
# emacs` with no "has the user changed it" guard, so `tmux show -g status-keys`
# reported emacs despite the config asking for vi.
set -g status-keys vi
