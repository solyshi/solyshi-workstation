# --- tmux status line (Matugen generated) ---
#
# Sourced from tmux.conf. tmux was the only app on this machine with no matugen
# template, so the status bar stayed on tmux's stock green while everything else
# followed the wallpaper.
#
# There was no status styling at all before this file, so these are new settings
# rather than overrides -- tmux.conf deliberately contains none of them, so the
# palette lives in exactly one place.

# --- Status bar ---
set -g status-style "fg=#c7c5d0,bg=#1f1f25"
set -g status-position bottom
set -g status-justify left

# Session name as a filled badge
set -g status-left "#[fg=#272b60,bg=#bec2ff,bold] #S #[default] "
set -g status-left-length 32

# Date, then time in the accent colour
set -g status-right "#[fg=#91909a]%a %d %b #[fg=#bec2ff,bold]%H:%M "
set -g status-right-length 40

# --- Windows ---
set -g window-status-format "#[fg=#c7c5d0,bg=#1f1f25] #I #W "
set -g window-status-current-format "#[fg=#e1e0f9,bg=#444559,bold] #I #W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#e8b9d5,bg=#1f1f25"
set -g window-status-bell-style "fg=#ffdad6,bg=#93000a"

# --- Panes ---
# Active border picks up the accent, so the focused pane is obvious without
# needing the status line.
set -g pane-border-style "fg=#46464f"
set -g pane-active-border-style "fg=#bec2ff"

# --- Command prompt and messages ---
set -g message-style "fg=#e0e0ff,bg=#3e4278"
set -g message-command-style "fg=#e0e0ff,bg=#3e4278"

# --- Copy mode selection ---
set -g mode-style "fg=#272b60,bg=#bec2ff"

# --- Popups (prefix+f runs tmux-sessionizer in one) ---
set -g popup-style "bg=#131318"
set -g popup-border-style "fg=#bec2ff"
