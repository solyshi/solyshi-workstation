# --- tmux status line (Matugen generated) ---
#
# Sourced from tmux.conf. tmux was the only app on this machine with no matugen
# template, so the status bar stayed on tmux's stock green while everything else
# followed the wallpaper.
#
# There was no status styling at all before this file, so these are new settings
# rather than overrides -- tmux.conf deliberately contains none of them, so the
# palette lives in exactly one place.

# --- Status bar ---
set -g status-style "fg=#c5c8ba,bg=#1e201a"
set -g status-position bottom
set -g status-justify left

# Session name as a filled badge
set -g status-left "#[fg=#1f3701,bg=#b2d18a,bold] #S #[default] "
set -g status-left-length 32

# Date, then time in the accent colour
set -g status-right "#[fg=#8f9285]%a %d %b #[fg=#b2d18a,bold]%H:%M "
set -g status-right-length 40

# --- Windows ---
set -g window-status-format "#[fg=#c5c8ba,bg=#1e201a] #I #W "
set -g window-status-current-format "#[fg=#dce7c8,bg=#404a33,bold] #I #W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#a0d0cb,bg=#1e201a"
set -g window-status-bell-style "fg=#ffdad6,bg=#93000a"

# --- Panes ---
# Active border picks up the accent, so the focused pane is obvious without
# needing the status line.
set -g pane-border-style "fg=#44483d"
set -g pane-active-border-style "fg=#b2d18a"

# --- Command prompt and messages ---
set -g message-style "fg=#cdeda3,bg=#354e16"
set -g message-command-style "fg=#cdeda3,bg=#354e16"

# --- Copy mode selection ---
set -g mode-style "fg=#1f3701,bg=#b2d18a"

# --- Popups (prefix+f runs tmux-sessionizer in one) ---
set -g popup-style "bg=#12140e"
set -g popup-border-style "fg=#b2d18a"
